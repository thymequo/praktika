<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>мокосины</title>
<style>
body { font-family: Tahoma, sans-serif; font-size: 12px; background: #f0f0f0; margin: 10px; }
h2 { font-size: 14px; margin: 10px 0 5px 0; }
div { margin: 5px 0; }
input, select, button { font-family: Tahoma, sans-serif; font-size: 11px; padding: 2px 4px; border: 1px solid #a0a0a0; background: #fff; }
button { background: #e0e0e0; cursor: pointer; }
button:hover { background: #d0d0d0; }
table { border-collapse: collapse; width: 100%; margin: 5px 0; }
td, th { border: 1px solid #a0a0a0; padding: 2px 4px; font-size: 11px; }
th { background: #e8e8e8; }
label { display: inline-block; width: 100px; }
#log { background: #fff; border: 1px solid #a0a0a0; padding: 5px; height: 100px; overflow-y: scroll; font-family: monospace; font-size: 10px; margin-top: 10px; }
</style>
</head>
<body>

<h2>Product</h2>
<div>
<label>Name:</label><input id="p_name"><br>
<label>Type:</label><input id="p_type"><br>
<label>Gender:</label><input id="p_gender"><br>
<label>Size:</label><input id="p_size"><br>
<label>Color:</label><input id="p_color"><br>
<label>Brand:</label><input id="p_brand"><br>
<label>Season:</label><input id="p_season"><br>
<label>Price:</label><input id="p_price" type="number" step="0.01"><br>
<button onclick="createProduct()">Create</button>
<button onclick="loadProducts()">Load All</button>
</div>
<div>
<label>Filter type:</label><input id="f_type" onchange="loadProducts()">
<label>gender:</label><input id="f_gender" onchange="loadProducts()">
<label>sort:</label><select id="f_sort" onchange="loadProducts()"><option value="">none</option><option value="price_asc">price asc</option><option value="price_desc">price desc</option></select>
</div>
<table id="products_table"><tr><th>ID</th><th>Name</th><th>Type</th><th>Price</th><th>Actions</th></tr></table>

<h2>Photo</h2>
<div>
<label>Product ID:</label><input id="ph_pid"><br>
<label>File:</label><input id="ph_file" type="file"><br>
<button onclick="createPhoto()">Upload</button>
</div>
<table id="photos_table"><tr><th>ID</th><th>Filename</th><th>Actions</th></tr></table>

<h2>Role</h2>
<div>
<label>Name:</label><input id="r_name"><br>
<button onclick="createRole()">Create</button>
<button onclick="loadRoles()">Load All</button>
</div>
<table id="roles_table"><tr><th>ID</th><th>Name</th><th>Actions</th></tr></table>

<h2>User</h2>
<div>
<label>Name:</label><input id="u_name"><br>
<label>Email:</label><input id="u_email"><br>
<label>Phone:</label><input id="u_phone"><br>
<label>Role ID:</label><input id="u_role"><br>
<button onclick="createUser()">Create</button>
<button onclick="loadUsers()">Load All</button>
</div>
<div>
<label>Role filter:</label><input id="u_frole" onchange="loadUsersByRole()">
<button onclick="loadUsersByRole()">Load by role</button>
</div>
<table id="users_table"><tr><th>ID</th><th>Name</th><th>Email</th><th>Role</th><th>Actions</th></tr></table>

<h2>Cart</h2>
<div>
<label>User ID:</label><input id="c_uid"><br>
<label>Product ID:</label><input id="c_pid"><br>
<label>Count:</label><input id="c_count" type="number"><br>
<button onclick="createCart()">Add</button>
<button onclick="loadCart()">Load Cart</button>
</div>
<table id="carts_table"><tr><th>ID</th><th>User</th><th>Product</th><th>Count</th><th>Actions</th></tr></table>

<h2>Order</h2>
<div>
<label>User ID:</label><input id="o_uid"><br>
<label>Status:</label><select id="o_status"><option value="1">Accepted</option><option value="2">In progress</option><option value="3">Assembled</option><option value="4">Ready</option><option value="5">Cancelled</option></select><br>
<button onclick="createOrder()">Create</button>
<button onclick="loadOrders()">Load All</button>
</div>
<div>
<label>From:</label><input id="o_from" type="date">
<label>To:</label><input id="o_to" type="date">
<label>Status:</label><input id="o_fstatus" type="number">
<button onclick="loadOrders()">Filter</button>
</div>
<table id="orders_table"><tr><th>ID</th><th>User</th><th>Date</th><th>Status</th><th>Actions</th></tr></table>

<h2>Order Item</h2>
<div>
<label>Order ID:</label><input id="oi_oid"><br>
<label>Product ID:</label><input id="oi_pid"><br>
<label>Price:</label><input id="oi_price" type="number" step="0.01"><br>
<button onclick="createOrderItem()">Add</button>
<button onclick="loadOrderItems()">Load</button>
</div>
<table id="orderitems_table"><tr><th>ID</th><th>Order</th><th>Product</th><th>Price</th></tr></table>

<div id="log"></div>

<script>
const API = 'http://localhost:8080';
function log(msg) { document.getElementById('log').innerHTML += msg + '<br>'; }
function clearTable(id) { const t = document.getElementById(id); while(t.rows.length > 1) t.deleteRow(1); }
function addRow(tableId, cells) { const t = document.getElementById(tableId); const r = t.insertRow(-1); cells.forEach(c => r.insertCell(-1).innerHTML = c); }

async function api(method, url, data, isFile) {
    const opts = { method, headers: {} };
    if (data) {
        if (isFile) { opts.body = data; }
        else { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(data); }
    }
    try {
        const r = await fetch(API + url, opts);
        if (r.status === 204) return null;
        const text = await r.text();
        try { return JSON.parse(text); } catch { return text; }
    } catch(e) { log('Error: ' + e); return null; }
}

async function createProduct() {
    const data = { name: p_name.value, type: p_type.value, gender: p_gender.value, size: p_size.value, color: p_color.value, brand: p_brand.value, season: p_season.value, price: parseFloat(p_price.value) };
    const r = await api('POST', '/product', data);
    log('Product created: ' + JSON.stringify(r));
    loadProducts();
}

async function loadProducts() {
    clearTable('products_table');
    let url = '/product?limit=100&offset=0';
    if (f_type.value) url += '&type=' + f_type.value;
    if (f_gender.value) url += '&gender=' + f_gender.value;
    if (f_sort.value) url += '&sort=' + f_sort.value;
    const data = await api('GET', url);
    if (data) data.forEach(p => addRow('products_table', [p.id, p.name, p.type, p.price, '<button onclick="deleteProduct(\''+p.id+'\')">Del</button>']));
}

async function deleteProduct(id) {
    await api('DELETE', '/product/' + id);
    loadProducts();
}

async function createPhoto() {
    const fd = new FormData();
    fd.append('file', ph_file.files[0]);
    fd.append('product_id', ph_pid.value);
    const r = await api('POST', '/photo', fd, true);
    log('Photo created: ' + JSON.stringify(r));
}

async function loadRoles() {
    clearTable('roles_table');
    const data = await api('GET', '/role');
    if (data) data.forEach(r => addRow('roles_table', [r.id, r.name, '<button onclick="deleteRole(\''+r.id+'\')">Del</button>']));
}

async function createRole() {
    const r = await api('POST', '/role', { name: r_name.value });
    log('Role created: ' + JSON.stringify(r));
    loadRoles();
}

async function deleteRole(id) {
    await api('DELETE', '/role/' + id);
    loadRoles();
}

async function createUser() {
    const data = { name: u_name.value, email: u_email.value, phone: u_phone.value, role_id: u_role.value };
    const r = await api('POST', '/user', data);
    log('User created: ' + JSON.stringify(r));
    loadUsers();
}

async function loadUsers() {
    clearTable('users_table');
    const data = await api('GET', '/user?limit=100&offset=0');
    if (data) data.forEach(u => addRow('users_table', [u.id, u.name, u.email, u.role_id, '<button onclick="deleteUser(\''+u.id+'\')">Del</button>']));
}

async function loadUsersByRole() {
    if (!u_frole.value) return;
    clearTable('users_table');
    const data = await api('GET', '/user/role/' + u_frole.value + '?limit=100&offset=0');
    if (data) data.forEach(u => addRow('users_table', [u.id, u.name, u.email, u.role_id, '']));
}

async function deleteUser(id) {
    await api('DELETE', '/user/' + id);
    loadUsers();
}

async function createCart() {
    const data = { user_id: c_uid.value, product_id: c_pid.value, count: parseInt(c_count.value) };
    const r = await api('POST', '/cart', data);
    log('Cart created: ' + JSON.stringify(r));
    loadCart();
}

async function loadCart() {
    if (!c_uid.value) return;
    clearTable('carts_table');
    const data = await api('GET', '/cart/' + c_uid.value);
    if (data) data.forEach(c => addRow('carts_table', [c.id, c.user_id, c.product_id, c.count, '<button onclick="deleteCart(\''+c.id+'\')">Del</button>']));
}

async function deleteCart(id) {
    await api('DELETE', '/cart/' + id);
    loadCart();
}

async function createOrder() {
    const data = { user_id: o_uid.value, status: parseInt(o_status.value) };
    const r = await api('POST', '/order', data);
    log('Order created: ' + JSON.stringify(r));
    loadOrders();
}

async function loadOrders() {
    clearTable('orders_table');
    let url = '/order?limit=100&offset=0';
    if (o_from.value) url += '&from=' + o_from.value;
    if (o_to.value) url += '&to=' + o_to.value;
    if (o_fstatus.value) url += '&status=' + o_fstatus.value;
    const data = await api('GET', url);
    if (data) data.forEach(o => addRow('orders_table', [o.id, o.user_id, o.date_time, o.status, '<button onclick="updateOrder(\''+o.id+'\')">Update</button>']));
}

async function updateOrder(id) {
    const status = prompt('New status (1-5):');
    if (status) {
        await api('PUT', '/order/' + id, { status: parseInt(status) });
        loadOrders();
    }
}

async function createOrderItem() {
    const data = { order_id: oi_oid.value, product_id: oi_pid.value, price: parseFloat(oi_price.value) };
    const r = await api('POST', '/order_item', data);
    log('OrderItem created: ' + JSON.stringify(r));
    loadOrderItems();
}

async function loadOrderItems() {
    if (!oi_oid.value) return;
    clearTable('orderitems_table');
    const data = await api('GET', '/order_item/' + oi_oid.value);
    if (data) data.forEach(oi => addRow('orderitems_table', [oi.id, oi.order_id, oi.product_id, oi.price]));
}
</script>

</body>
</html>
