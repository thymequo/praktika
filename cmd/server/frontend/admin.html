<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1100">
  <title>Управление | Магазин одежды</title>
  <link rel="stylesheet" href="style.css?v=15">
</head>
<body>
  <div class="main-wrapper">
    <header class="site-header">
      <div class="header-top">
        <a href="index.html" class="logo">МАГАЗИН ОДЕЖДЫ</a>
        <div class="header-user" id="header-actions"></div>
      </div>
      <nav class="main-nav" id="main-nav">
        <a href="index.html" class="nav-link">Главная</a>
        <a href="cart.html" class="nav-link">Корзина</a>
        <a href="admin.html" class="nav-link active" id="nav-admin-link">Управление</a>
      </nav>
    </header>
    <main class="site-content" style="display:block;padding:20px;">
      <div id="admin-denied" class="error-box" style="display:none;">
        <h3>Доступ запрещен</h3>
        <p>Войдите под email: <b>admin@demo.com</b></p>
        <a href="index.html" class="btn-primary" style="text-decoration:none;display:inline-block;padding:5px 15px;">На главную</a>
      </div>
      <div id="admin-panel" style="display:none;">
        <div id="admin-list-view">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;">
            <h2 class="page-title" style="margin:0;">Управление товарами</h2>
            <button class="btn-primary" onclick="showAdminForm()">+ Добавить новый товар</button>
          </div>
          <table class="table-classic">
            <thead><tr><th>Фото</th><th>Название</th><th>Бренд</th><th>Цена</th><th>Действия</th></tr></thead>
            <tbody id="admin-products-table"></tbody>
          </table>
        </div>
        <div id="admin-form-view" style="display:none;">
          <h2 class="page-title" id="form-title">Добавить товар</h2>
          <div class="admin-box">
            <form id="product-form" class="form-classic" enctype="multipart/form-data">
              <input type="hidden" name="product_id" id="edit-product-id">
              <div class="form-row">
                <div class="form-group"><label>Название:</label><input name="name" id="edit-name" class="input-field" required></div>
                <div class="form-group"><label>Бренд:</label><input name="brand" id="edit-brand" class="input-field" required></div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Тип:</label>
                  <select name="type" id="edit-type" class="input-field" required>
                    <option value="">Выберите тип</option>
                    <option value="tops">Футболки</option>
                    <option value="hoodie">Худи</option>
                    <option value="pants">Брюки</option>
                    <option value="shoes">Обувь</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Пол:</label>
                  <select name="gender" id="edit-gender" class="input-field">
                    <option value="male">Мужской</option>
                    <option value="female">Женский</option>
                    <option value="unisex">Унисекс</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Размер:</label>
                  <select name="size" id="edit-size" class="input-field">
                    <option value="">Выберите размер</option>
                    <option value="XS">XS</option>
                    <option value="S">S</option>
                    <option value="M">M</option>
                    <option value="L">L</option>
                    <option value="XL">XL</option>
                    <option value="XXL">XXL</option>
                  </select>
                </div>
                <div class="form-group">
                  <label>Цвет:</label>
                  <select name="color" id="edit-color" class="input-field">
                    <option value="">Выберите цвет</option>
                    <option value="white">Белый</option>
                    <option value="black">Чёрный</option>
                    <option value="gray">Серый</option>
                    <option value="blue">Синий</option>
                    <option value="red">Красный</option>
                    <option value="green">Зелёный</option>
                    <option value="yellow">Жёлтый</option>
                    <option value="brown">Коричневый</option>
                    <option value="beige">Бежевый</option>
                    <option value="pink">Розовый</option>
                    <option value="purple">Фиолетовый</option>
                    <option value="orange">Оранжевый</option>
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label>Сезон:</label>
                  <select name="season" id="edit-season" class="input-field">
                    <option value="">Любой</option>
                    <option value="summer">Лето</option>
                    <option value="winter">Зима</option>
                    <option value="spring">Весна</option>
                    <option value="autumn">Осень</option>
                  </select>
                </div>
                <div class="form-group"><label>Цена (₽):</label><input type="number" name="price" id="edit-price" step="0.01" class="input-field" required placeholder="1500"></div>
              </div>
              <div class="form-group"><label>Описание:</label><textarea name="description" id="edit-description" rows="4" class="input-field" style="resize:vertical;"></textarea></div>
              <div class="form-group" style="background:#f9f9f9;padding:15px;border:1px solid #e0e0e0;border-radius:3px;">
                <label style="display:block;margin-bottom:8px;font-weight:bold;font-size:12px;">Изображение товара:</label>
                <input type="file" id="edit-photo" name="photo" accept="image/*" class="input-field" style="background:white;cursor:pointer;">
                <small style="color:#666;display:block;margin-top:5px;">Оставьте пустым, чтобы не менять картинку при редактировании.</small>
              </div>
              <div style="margin-top:20px;padding-top:15px;border-top:1px solid #e0e0e0;">
                <button type="submit" class="btn-primary">Сохранить товар</button>
                <button type="button" class="btn-small" onclick="showAdminList()" style="margin-left:10px;">Отмена</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </main>
    <footer class="site-footer">&copy; Магазин одежды.</footer>
  </div>
  <script src="script.js?v=15"></script>
</body>
</html>
